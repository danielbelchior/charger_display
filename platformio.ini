; PlatformIO build for the charger display. See docs/platformio.md.
;
;   pio run                      compile (env "usb")
;   pio run -t upload            flash over USB
;   pio run -e ota -t upload     flash over WiFi (needs ENABLE_OTA 1 on the device)
;   pio device monitor           serial log, 115200 baud

[platformio]
src_dir = main
default_envs = usb

[env]
; pioarduino ships Arduino-ESP32 3.x; the official "espressif32" platform is still on 2.x.
; 54.03.20 = Arduino-ESP32 3.2.0 / ESP-IDF 5.4.1.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
; Two 1.9 MB app slots (OTA needs two) instead of the default 1.25 MB; the
; firmware uses no filesystem, so the small SPIFFS partition is not missed.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0
    links2004/WebSockets@^2.6.0
    gilmaimon/ArduinoWebsockets@^0.5.4

[env:usb]
upload_speed = 921600
; upload_port = /dev/cu.usbserial-0001   ; set if auto-detection picks the wrong port

[env:ota]
upload_protocol = espota
; mDNS name from DEVICE_HOSTNAME; override with --upload-port <ip> if .local does not resolve.
upload_port = charger.local
upload_flags =
    --port=3232
; Adds --auth from OTA_PASSWORD (environment variable, else main/secrets.h).
extra_scripts = post:scripts/pio_ota_auth.py
