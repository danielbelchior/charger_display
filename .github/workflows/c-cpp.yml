name: Firmware CI

on:
  push:
    paths:
      - "main/**"
      - "tests/**"
      - "scripts/**"
      - "control-panel/**"
      - "platformio.ini"
      - ".clang-format"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "main/**"
      - "tests/**"
      - "scripts/**"
      - "control-panel/**"
      - "platformio.ini"
      - ".clang-format"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main are queued, not cancelled, so a release is never cut in half
  # and two runs cannot pick the same version number.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # vYYYY.MM.DD.N (Amsterdam date, N counts releases that day). Only pushes
      # to main and manual runs on main create a release.
      - name: Compute next version
        id: next
        run: |
          day=$(TZ=Europe/Amsterdam date +%Y.%m.%d)
          last=$(git tag -l "v${day}.*" | sed "s/^v${day}\.//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -n 1)
          version="v${day}.$(( ${last:-0} + 1 ))"
          release=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; }; then
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Next version: $version (release: $release)"

  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # wifi_policy, validation, log_ring, display_frame (see tests/host).
      - name: Run host unit tests (GCC)
        run: scripts/test.sh

      - name: Run host unit tests (Clang, ASan + UBSan)
        run: scripts/test.sh
        env:
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all

  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so formatting does not change with the runner image.
      - name: Install clang-format
        run: pip install clang-format==17.0.6

      - name: Check formatting
        run: scripts/format.sh --check

  build:
    runs-on: ubuntu-latest
    needs: [version, host-tests]
    env:
      # Release builds carry the new tag; other builds fall back to `git describe`
      # in scripts/pio_version.py.
      FIRMWARE_VERSION: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Prepare secrets.h
        run: cp main/secrets_template.h main/secrets.h

      - name: Compile (USB env)
        run: pio run -e usb

      - name: Compile with OTA enabled (OTA env)
        run: |
          echo '#define ENABLE_OTA 1' >> main/secrets.h
          pio run -e ota

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/usb/firmware.bin
            .pio/build/ota/firmware.bin
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [version, build, format]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write

    steps:
      # No checkout needed: gh creates the tag on the tested commit. The CI
      # binaries are not attached because they contain the template secrets,
      # not your WiFi and Home Assistant settings.
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --latest
