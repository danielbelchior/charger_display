name: Firmware CI

on:
  push:
    paths:
      - "main/**"
      - "tests/**"
      - "scripts/**"
      - "platformio.ini"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "main/**"
      - "tests/**"
      - "scripts/**"
      - "platformio.ini"
      - ".github/workflows/**"

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run host unit tests
        run: scripts/test.sh

  build:
    runs-on: ubuntu-latest
    needs: host-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Prepare secrets.h
        run: cp main/secrets_template.h main/secrets.h

      - name: Compile
        run: pio run -e usb

      - name: Compile with OTA enabled
        run: |
          echo '#define ENABLE_OTA 1' >> main/secrets.h
          pio run -e ota
